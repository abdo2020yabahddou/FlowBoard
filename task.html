<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="task.css">
</head>
<body>
<div class="container-fluid p-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>Task Board</h1>
        <button class="btn btn-primary">+ New Card</button>
    </header>
    <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <label>
                <input type="text" class="form-control" placeholder="Search tasks...">
            </label>
        </div>
        <div class="col-md-3 mb-2">
            <label>
                <select class="form-select">
                    <option>All priorities</option>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </label>
        </div>
        <div class="col-md-3 mb-2">
            <label>
                <select class="form-select">
                    <option>Everyone</option>
                    <option>Sara</option>
                    <option>Youssef</option>
                </select>
            </label>
        </div>
        <div class="col-md-2 mb-2">
            <button class="btn btn-outline-secondary w-100">
                Reset
            </button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="kanban-column todo">
                <h5>To Do</h5>
                <div class="task-card">
                    <h6>Create login page</h6>
                    <p>Design the login interface.</p>
                    <span class="badge bg-danger">High</span>
                    <small>Sara</small>
                </div>
                <div class="task-card">
                    <h6>Design dashboard</h6>
                    <p>Create the dashboard layout.</p>
                    <span class="badge bg-warning text-dark">Medium</span>
                    <small>Youssef</small>
                </div>

                <button class="btn btn-outline-secondary btn-sm mt-2">
                    + Add a card
                </button>

            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="kanban-column in-progress">
                <h5>In Progress</h5>
                <div class="task-card">
                    <h6>Fix navigation</h6>
                    <p>Improve website navigation.</p>
                    <span class="badge bg-danger">High</span>
                    <small>Sara</small>
                </div>
                <button class="btn btn-outline-secondary btn-sm mt-2">
                    + Add a card
                </button>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="kanban-column done">
                <h5>Done</h5>
                <div class="task-card">
                    <h6>Setup project</h6>
                    <p>Initialize the project.</p>
                    <span class="badge bg-success">Low</span>
                    <small>Youssef</small>
                </div>
                <button class="btn btn-outline-secondary btn-sm mt-2">
                    + Add a card
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
