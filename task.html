<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="task.css">
</head>
<body>
<div class="container-fluid p-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>Task Board</h1>
        <button class="btn btn-primary" id="addCardBtn">+ New Card</button>
        <div id="addCardModal" class="add-card-modal">
            <div class="modal-content">
                <div class="modal-header-custom">
                    <div>
                        <h4>Add a new task</h4>
                    </div>
                    <button type="button" class="close" aria-label="Close">
                        &times;
                    </button>
                </div>
                <div class="modal-body-custom">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="taskName" class="form-label">
                                Task name
                            </label>
                            <input type="text" class="form-control" id="taskName"
                                   placeholder="Ex: Maquetter la page d'accueil" required>
                        </div>
                        <div class="col-md-6">
                            <label for="priority" class="form-label">
                                Priority
                            </label>
                            <select class="form-select" id="priority">
                                <option value="">Choose priority</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">
                                Status
                            </label>
                            <select class="form-select" id="status">
                                <option value="">Choose status</option>
                                <option value="todo">To do</option>
                                <option value="in-progress">In progress</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">
                                Description
                            </label>
                            <textarea class="form-control" id="description"
                                      rows="3"
                                      placeholder="Describe your task..."
                                      required></textarea>
                        </div>
                        <div class="col-12">
                            <label for="taskAssigned" class="form-label">
                                Assigned to
                            </label>
                            <select class="form-select" id="taskAssigned" required>
                                <option value="choose">Choose a team member's name</option>
                                <option value="TM1">Amina Haddad</option>
                                <option value="TM2">Yasmine Benali</option>
                                <option value="TM3">Thomas Leroy</option>
                                <option value="TM4">Lucas Martin</option>
                                <option value="TM5">Inès Moreau</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer-custom">
                    <button id="submitBtn" type="button" class="btn submit-btn">
                        Create task
                    </button>
                </div>
            </div>
        </div>
    </header>
    <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <label>
                <input type="text" class="form-control" placeholder="Search tasks...">
            </label>
        </div>
        <form id="filterForm">
            <div class="col-md-3 mb-2">
                <label>
                    <select class="form-select">
                        <option>All priorities</option>
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>
                </label>
            </div>
            <div class="col-md-3 mb-2">
                <label>
                    <select class="form-select">
                        <option value="All">Everyone</option>
                        <option value="TM1">Amina Haddad</option>
                        <option value="TM2">Yasmine Benali</option>
                        <option value="TM3">Thomas Leroy</option>
                        <option value="TM4">Lucas Martin</option>
                        <option value="TM5">Inès Moreau</option>
                    </select>
                </label>
            </div>
        </form>
        <div class="col-md-2 mb-2">
            <button type="reset" class="btn btn-outline-secondary w-100" id="resetBtn">
                Reset
            </button>
        </div>
    </div>
    <div class="row" id="container">
    </div>
    <div class="error-handler" id="errorHandler">
        <p> error, please try again</p>
        <button id="refreshBtn"> refresh</button>
    </div>
    <div id="loader" class="loader-h">
        loading...
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="filter.js"></script>
<script src="api.js"></script>
<script src="addCard.js"></script>
</body>
</html>
