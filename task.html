<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="task.css">
</head>
<body>
<div class="container-fluid p-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>Task Board</h1>
        <button class="btn btn-primary" id="addCardBtn">+ New Card</button>
        <button class="btn btn-primary" id="generateWithAI">+ Generate with AI</button>
        <div class="addTasks-byAI-modal" id="addTasksByAiModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h3>Generate Tasks with AI</h3>
                    </div>
                    <button type="button" class="close-modal" id="closeAiModal">
                        &times;
                    </button>
                </div>
                <div class="modal-body">
                    <label for="descriptionForAi" class="form-label">
                        Description
                    </label>
                    <textarea class="form-control" id="descriptionForAi" rows="4"
                              placeholder="Describe what you want..." required></textarea>
                    <label for="count" class="form-label">
                        Number of tasks
                    </label>
                    <input type="number" id="count" class="form-control" min="1" max="10" placeholder="ex: 5">
                </div>
                <div class="modal-footer">
                    <button type="button" id="createTasksByAI">
                        Generate Tasks
                    </button>
                </div>
            </div>
        </div>
    </header>
    <form id="filterForm" class="row mb-4">
        <div class="col-md-4 mb-2">
            <label>
                <input type="text" id="keywordFilter" class="form-control" placeholder="Search tasks...">
            </label>
        </div>
        <div class="col-md-3 mb-2">
            <label>
                <select class="form-select" id="priorityFilter">
                    <option value="">All priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </label>
        </div>
        <div class="col-md-3 mb-2">
            <label>
                <select class="form-select" id="assignedFilter">
                    <option value="">Everyone</option>
                    <option value="Amina Haddad">Amina Haddad</option>
                    <option value="Yasmine Benali">Yasmine Benali</option>
                    <option value="Thomas Leroy">Thomas Leroy</option>
                    <option value="Lucas Martin">Lucas Martin</option>
                    <option value="Inès Moreau">Inès Moreau</option>
                </select>
            </label>
        </div>
        <div class="col-md-2 mb-2">
            <button type="reset" class="btn btn-outline-secondary w-100" id="resetBtn">
                Reset
            </button>
        </div>
    </form>
    <p id="noResults" style="display: none;">
        No cards match your filters.
    </p>
    <div class="row" id="container"></div>
    <div class="error-handler" id="errorHandler">
        <p> error, please try again</p>
        <button id="refreshBtn"> refresh</button>
    </div>
    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p>Loading...</p>
    </div>
    <div id="addCardModal" class="add-card-modal">
        <div class="modal-content">
            <div class="modal-header-custom">
                <div>
                    <h4 id="AddTaskTitle">Add a new task</h4>
                </div>
                <button type="button" class="close" aria-label="Close">
                    &times;
                </button>
            </div>
            <div class="modal-body-custom">
                <div class="row g-3">
                    <div id="idTask" hidden="hidden">
                        where the id is
                    </div>
                    <div class="col-12">
                        <label for="taskName" class="form-label">
                            Task name
                        </label>
                        <input type="text" class="form-control" id="taskName"
                               placeholder="Ex: Maquetter la page d'accueil" required>
                        <small class="discountError text-danger"></small>
                    </div>
                    <div class="col-md-6">
                        <label for="priority" class="form-label">
                            Priority
                        </label>
                        <select class="form-select" id="priority">
                            <option value="">Choose priority</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                        <small class="discountError text-danger"></small>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label">
                            Status
                        </label>
                        <select class="form-select" id="status">
                            <option value="">Choose status</option>
                            <option value="todo">To do</option>
                            <option value="in-progress">In progress</option>
                            <option value="done">Done</option>
                        </select>
                        <small class="discountError text-danger"></small>
                    </div>
                    <div class="col-12">
                        <label for="description" class="form-label">
                            Description
                        </label>
                        <textarea class="form-control" id="description" rows="3"
                                  placeholder="Describe your task..." required>
                            </textarea>
                        <small class="discountError text-danger"></small>
                    </div>
                    <div class="col-12">
                        <label for="taskAssigned" class="form-label">
                            Assigned to
                        </label>
                        <select class="form-select" id="taskAssigned" required>
                            <option value="">Choose a team member's name</option>
                            <option value="Amina Haddad">Amina Haddad</option>
                            <option value="Yasmine Benali">Yasmine Benali</option>
                            <option value="Thomas Leroy">Thomas Leroy</option>
                            <option value="Lucas Martin">Lucas Martin</option>
                            <option value="Inès Moreau">Inès Moreau</option>
                        </select>
                        <small class="discountError text-danger"></small>
                    </div>
                </div>
            </div>
            <div id="submitBtnDiv" class="modal-footer-custom">
                <button id="submitBtn" type="button" class="btn submit-btn">
                    Create task
                </button>
            </div>
            <div class="modal-footer-custom">
                <button id="saveButton" type="button" class="btn submit-btn" style="display: none">
                    save
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="filter.js"></script>
<script type="module" src="api.js"></script>
<script type="module" src="addCard.js"></script>
<script type="module" src="update.js"></script>
<script type="module" src="delete.js"></script>
<script type="module" src="addTasksbyAi.js"></script>
<script type="module" src="config.js"></script>
</body>
</html>
